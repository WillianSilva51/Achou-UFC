services:

  # ─── API PHP ──────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: achados_api
    restart: unless-stopped
    ports:
      - "8000:80"           # acesse em http://localhost:8000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - achados_net

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine   # Alpine = imagem menor (~80 MB)
    container_name: achados_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data     # dados persistem entre restarts
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:Z  # cria as tabelas na 1ª vez
    ports:
      - "5432:5432"       # expõe pra você acessar com psql/DBeaver se quiser
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - achados_net

volumes:
  postgres_data:

networks:
  achados_net:
    driver: bridge
