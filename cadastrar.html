<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar item — Achou! UFC Quixadá</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components/admin.css">
    <link rel="stylesheet" href="css/sections/nav.css">
</head>

<body>
    <script src="js/app.js"></script>
    <script>requireAuth('admin');</script>

    <nav class="navbar navbar-expand-lg navbar-ufc">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="admin.html">
                <img src="assets/images/Brasao4_vertical_cor_300dpi.png" alt="UFC" class="brand-logo">
                <span class="brand-title">Achou!<span class="accent"> UFC</span> · Cadastrar item</span>
            </a>
            <div class="d-flex gap-2">
                <a href="admin.html" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left"></i> Painel</a>
                <button class="btn btn-sm btn-gold" onclick="logout()"><i class="bi bi-box-arrow-right"></i>
                    Sair</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card stat-card">
                    <div class="card-body">
                        <h5 class="mb-3"><i class="bi bi-plus-circle text-primary"></i> Cadastrar novo item encontrado
                        </h5>

                        <form id="form-item" class="needs-validation" novalidate>
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label">Título *</label>
                                    <input name="titulo" type="text" class="form-control" required minlength="3"
                                        maxlength="120" placeholder="Ex: Chave com chaveiro azul">
                                    <div class="invalid-feedback">Informe o título (mín. 3 caracteres).</div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Descrição *</label>
                                    <textarea name="descricao" class="form-control" rows="3" required minlength="5"
                                        maxlength="500"
                                        placeholder="Detalhes que ajudem o dono a identificar"></textarea>
                                    <div class="invalid-feedback">Adicione uma descrição.</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Categoria *</label>
                                    <select name="categoria_id" id="sel-cat" class="form-select" required></select>
                                    <div class="invalid-feedback">Selecione uma categoria.</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Local encontrado *</label>
                                    <select name="local_id" id="sel-loc" class="form-select" required></select>
                                    <div class="invalid-feedback">Selecione o local.</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Data *</label>
                                    <input name="data_encontrado" type="date" class="form-control" required>
                                    <div class="invalid-feedback">Informe a data.</div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">URL da foto (opcional)</label>
                                    <input name="foto_url" type="url" class="form-control" maxlength="2048"
                                        placeholder="https://...">
                                </div>
                            </div>
                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-ufc"><i class="bi bi-save"></i> Cadastrar</button>
                                <a href="admin.html" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>

                        <div id="ok-msg" class="alert alert-success mt-3 d-none">
                            <i class="bi bi-check-circle-fill"></i> Item cadastrado com sucesso!
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const selCat = document.getElementById('sel-cat');
        const selLoc = document.getElementById('sel-loc');
        const dataEncontrado = document.querySelector('input[name=data_encontrado]');
        dataEncontrado.value = new Date().toISOString().slice(0, 10);
        dataEncontrado.max = dataEncontrado.value;

        async function carregarCombos() {
            try {
                const [categorias, locais] = await Promise.all([
                    AchouApi.listarCategorias(),
                    AchouApi.listarLocais()
                ]);
                selCat.innerHTML = '<option value="">Selecione...</option>' + categorias.map(c => `<option value="${c.id}">${escapeHtml(c.nome)}</option>`).join('');
                selLoc.innerHTML = '<option value="">Selecione...</option>' + locais.map(l => `<option value="${l.id}">${escapeHtml(l.nome)}</option>`).join('');
            } catch (error) {
                document.getElementById('ok-msg').className = 'alert alert-danger mt-3';
                document.getElementById('ok-msg').innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i> ${escapeHtml(error.message)}`;
            }
        }

        document.getElementById('form-item').addEventListener('submit', async function (e) {
            e.preventDefault();
            if (!this.checkValidity()) { this.classList.add('was-validated'); return; }
            const fd = new FormData(this);

            const payload = {
                titulo: fd.get('titulo'),
                descricao: fd.get('descricao'),
                categoria_id: parseInt(fd.get('categoria_id'), 10),
                local_id: parseInt(fd.get('local_id'), 10),
                data_encontrado: fd.get('data_encontrado'),
                status: 'disponivel'
            };

            if (fd.get('foto_url')) {
                payload.foto_url = fd.get('foto_url');
            }

            const ok = document.getElementById('ok-msg');
            try {
                await AchouApi.criarItem(payload);
                this.reset();
                this.classList.remove('was-validated');
                dataEncontrado.value = new Date().toISOString().slice(0, 10);
                ok.className = 'alert alert-success mt-3';
                ok.innerHTML = '<i class="bi bi-check-circle-fill"></i> Item cadastrado com sucesso!';
                setTimeout(() => ok.classList.add('d-none'), 3000);
            } catch (error) {
                ok.className = 'alert alert-danger mt-3';
                ok.innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i> ${escapeHtml(error.message)}`;
            }
        });

        carregarCombos();
    </script>
</body>

</html>
