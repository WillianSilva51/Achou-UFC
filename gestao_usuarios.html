<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários — Achou! UFC Quixadá</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components/admin.css">
    <link rel="stylesheet" href="css/sections/nav.css">
</head>

<body class="admin-page">
    <script src="src/js/app.js?v=docker-api-20260701"></script>
    <script src="src/js/guard-admin.js?v=docker-api-20260701"></script>

    <div data-header="admin"></div>

    <div class="container-fluid p-0">
        <div class="row g-0">
            <aside class="col-md-3 col-lg-2 admin-sidebar p-0">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="admin.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastrar.html"><i class="bi bi-plus-circle"></i> Cadastrar item</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html#itens"><i class="bi bi-box-seam"></i> Itens cadastrados</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html#reivindicacoes"><i class="bi bi-hand-index-thumb"></i> Reivindicações</a></li>
                    <li class="nav-item admin-sidebar-separator"><a class="nav-link" href="gestao_entidades.html"><i class="bi bi-tags"></i> Categorias e Locais</a></li>
                    <li class="nav-item"><a class="nav-link sidebar-link-active" href="gestao_usuarios.html"><i class="bi bi-people"></i> Usuários</a></li>
                </ul>
            </aside>

            <main class="col-md-9 col-lg-10 py-4 px-3 px-md-4">
                <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-4">
                    <div>
                        <h4 class="mb-0">Usuários</h4>
                        <small class="text-muted">Consulte contas de alunos e administradores cadastrados.</small>
                    </div>
                    <form id="form-filtros-usuarios" class="d-flex flex-column flex-sm-row gap-2">
                        <input id="f-busca-usuario" class="form-control" type="search" placeholder="Buscar nome ou e-mail">
                        <select id="f-role-usuario" class="form-select">
                            <option value="">Todos</option>
                            <option value="aluno">Alunos</option>
                            <option value="admin">Administradores</option>
                        </select>
                    </form>
                </div>

                <section class="entity-card">
                    <div class="card-header">
                        <h6><i class="bi bi-people-fill text-primary me-2"></i>Contas cadastradas</h6>
                        <span class="badge text-bg-light" id="contador-usuarios">0</span>
                    </div>
                    <div class="card-body p-0">
                        <div id="loading-usuarios" class="text-center py-4">
                            <div class="spinner-border spinner-border-sm text-primary"></div>
                        </div>
                        <div id="erro-usuarios" class="alert alert-danger m-3 d-none"></div>
                        <div class="table-responsive d-none" id="bloco-tabela-usuarios">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">Nome</th>
                                        <th>E-mail</th>
                                        <th>Perfil</th>
                                        <th class="text-end pe-3">ID</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-usuarios"></tbody>
                            </table>
                        </div>
                        <div class="tbl-empty d-none" id="empty-usuarios">
                            <i class="bi bi-people"></i>
                            Nenhum usuário encontrado.
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="src/js/gestao-usuarios.js?v=docker-api-20260701"></script>
</body>

</html>
