<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Achou! UFC</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-ufc-blue-dark d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-5">

                <div class="card shadow p-4">
                    <h3 class="text-center mb-4">Registro</h3>
                    <p class="text-muted text-center">Crie sua conta para continuar</p>

                    <form action="/api/register" method="POST" class="text-start needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label d-block">Tipo de conta</label>
                            <div class="btn-group w-100" role="group" aria-label="Tipo de conta">
                                <input type="radio" class="btn-check" name="role" id="role-aluno" value="aluno"
                                    autocomplete="off" checked>
                                <label class="btn btn-outline-primary" for="role-aluno">
                                    <i class="bi bi-mortarboard"></i>
                                    Aluno
                                </label>

                                <input type="radio" class="btn-check" name="role" id="role-admin" value="admin"
                                    autocomplete="off">
                                <label class="btn btn-outline-primary" for="role-admin">
                                    <i class="bi bi-person-gear"></i>
                                    Admin
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="nome" name="nome" required
                                    placeholder="Seu nome completo">
                                <div class="invalid-feedback">Informe seu nome.</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required
                                    placeholder="nome@ufc.br">
                                <div class="invalid-feedback">Informe um e-mail válido.</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="senha" minlength="8"
                                    required placeholder="Mínimo 8 caracteres">
                                <div class="invalid-feedback">A senha deve ter pelo menos 8 caracteres.</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirm-password" class="form-label">Confirmar senha</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" class="form-control" id="confirm-password"
                                    name="confirmar_senha" minlength="8" required placeholder="Digite a senha novamente">
                                <div class="invalid-feedback">As senhas precisam ser iguais.</div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="identificador" class="form-label" id="identificador-label">Matrícula</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-credit-card-2-front"
                                        id="identificador-icon"></i></span>
                                <input type="text" class="form-control" id="identificador" name="matricula" required
                                    placeholder="Digite sua matrícula">
                                <div class="invalid-feedback" id="identificador-feedback">Informe sua matrícula.</div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                    </form>

                    <p class="text-center mt-3">
                        <a href="login.html" class="text-decoration-none">Já tem uma conta? Faça login</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const roleInputs = document.querySelectorAll('input[name="role"]');
        const identificadorLabel = document.getElementById('identificador-label');
        const identificadorInput = document.getElementById('identificador');
        const identificadorIcon = document.getElementById('identificador-icon');
        const identificadorFeedback = document.getElementById('identificador-feedback');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');

        function atualizarIdentificador() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const isAdmin = role === 'admin';

            identificadorLabel.textContent = isAdmin ? 'SIAPE' : 'Matrícula';
            identificadorInput.name = isAdmin ? 'siape' : 'matricula';
            identificadorInput.placeholder = isAdmin ? 'Digite seu SIAPE' : 'Digite sua matrícula';
            identificadorFeedback.textContent = isAdmin ? 'Informe seu SIAPE.' : 'Informe sua matrícula.';
            identificadorIcon.className = isAdmin ? 'bi bi-person-vcard' : 'bi bi-credit-card-2-front';
            identificadorInput.value = '';
        }

        function validarConfirmacaoSenha() {
            const senhasIguais = confirmPasswordInput.value === passwordInput.value;
            confirmPasswordInput.setCustomValidity(senhasIguais ? '' : 'As senhas precisam ser iguais.');
        }

        roleInputs.forEach((input) => input.addEventListener('change', atualizarIdentificador));
        passwordInput.addEventListener('input', validarConfirmacaoSenha);
        confirmPasswordInput.addEventListener('input', validarConfirmacaoSenha);

        document.querySelectorAll('.needs-validation').forEach((form) => {
            form.addEventListener('submit', (event) => {
                validarConfirmacaoSenha();

                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                form.classList.add('was-validated');
            });
        });
    </script>
</body>

</html>
