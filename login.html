<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Achou! UFC</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-ufc-blue-dark d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-5 col-lg-4">

                <div class="card auth-card p-4">
                    <h3 class="text-center mb-4">Login</h3>
                    <p class="text-muted text-center">Faça seu login para continuar</p>

                    <form id="form-login" class="text-start needs-validation" novalidate>
                        <label for="email" class="form-label">Email</label>
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required
                                    placeholder="aluno@alu.ufc.br">
                                <div class="invalid-feedback">E-mail inválido.</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="senha" minlength="8"
                                    required placeholder="Senha123">
                                <div class="invalid-feedback">Informe a senha.</div>
                            </div>
                        </div>
                        <div id="erro" class="alert alert-danger small py-2 d-none">Credenciais inválidas.</div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>

                    <p class="text-center mt-3">
                        <a href="register.html" class="text-decoration-none">Não tem uma conta? Cadastre-se</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        redirectIfAuthenticated();

        const formLogin = document.getElementById('form-login');
        const erroLogin = document.getElementById('erro');

        formLogin.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!formLogin.checkValidity()) {
                formLogin.classList.add('was-validated');
                return;
            }

            erroLogin.classList.add('d-none');

            try {
                const fd = new FormData(formLogin);
                await AchouApi.login({
                    email: fd.get('email'),
                    senha: fd.get('senha')
                });

                const next = new URLSearchParams(location.search).get('next');
                location.href = next || (authUser()?.role === 'admin' ? 'admin.html' : 'index.html');
            } catch (error) {
                erroLogin.textContent = error.message;
                erroLogin.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
