<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Achou! UFC</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components/auth.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="auth-page d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-5 col-lg-4">

                <div class="card auth-card p-4">
                    <h3 class="text-center mb-4">Login</h3>
                    <p class="text-muted text-center">Faça seu login para continuar</p>

                    <form id="form-login" class="text-start needs-validation" novalidate>
                        <label for="email" class="form-label">Email</label>
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required
                                    placeholder="aluno@alu.ufc.br">
                                <div class="invalid-feedback">E-mail inválido.</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="senha" minlength="8"
                                    required placeholder="Senha123">
                                <div class="invalid-feedback">Informe a senha.</div>
                            </div>
                        </div>
                        <div id="erro" class="alert alert-danger small py-2 d-none">Credenciais inválidas.</div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>

                    <form id="form-verificacao-login" class="text-start d-none mt-3" novalidate>
                        <input type="hidden" id="login-verificacao-email" name="email">
                        <label for="login-codigo-verificacao" class="form-label">Código recebido no email</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                                class="form-control" id="login-codigo-verificacao" name="codigo" required
                                placeholder="000000">
                            <div class="invalid-feedback">Informe o código de 6 dígitos.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ativar conta</button>
                        <button type="button" id="login-reenviar-codigo" class="btn btn-link w-100 mt-1">Reenviar código</button>
                    </form>

                    <p class="text-center mt-3">
                        <a href="register.html" class="text-decoration-none">Não tem uma conta? Cadastre-se</a>
                    </p>
                    <p class="text-center mb-0">
                        <a href="auth_hub.html" class="text-decoration-none small">Voltar ao portal de acesso</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/env.js?v=recaptcha-20260704"></script>
    <script src="src/js/app.js?v=docker-api-20260701"></script>
    <script src="src/js/login.js?v=docker-api-20260701"></script>
</body>

</html>
